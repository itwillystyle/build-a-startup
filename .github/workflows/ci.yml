name: CI

# The pre-commit hook's UTF-8 check, selene, the offline Lune suite and the type check, where a
# stranger can see them pass. selene catches the forward-reference bug class that bit this codebase seven times (a local function
# called above its definition reads as `undefined_variable`); the Lune suite covers the pure modules.
# No formatting step: `stylua --check src` wanted 167 files changed on every run and could never
# fail the build, so it was noise, not a check. Add it back as a gate after the `stylua src` commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: UTF-8
        # the pre-commit hook's check, for commits that skipped the hook (--no-verify, a web edit). A Latin-1 byte
        # renders garbled and can stop Rojo syncing the file.
        run: git ls-files -- '*.lua' '*.luau' | grep -v '^Packages/' | python3 hooks/check_utf8.py

      - name: Generate the Roblox std for selene
        # selene.toml sets std = "roblox", which needs roblox.yml. It is generated
        # rather than committed so it tracks the current API dump.
        run: selene generate-roblox-std

      - name: Lint
        # Packages/ is Wally-vendored third-party code and is not ours to lint.
        # Warnings pass, errors fail: same rule as the pre-commit hook.
        run: selene --allow-warnings src tests tools

      - name: Offline tests
        run: lune run tests/offline/run

      - name: Type check
        # luau-lsp over src/ with the Roblox types (pinned to luau-lsp 1.70.1, sha256-checked).
        # Fails only on a type or syntax error a file did not have in tests/types-baseline.txt,
        # so the known ones (mostly tables that gain fields later) don't block anything. A PR that
        # raises a count in tests/types-baseline.txt should say why. Green is not "no type bugs":
        # src/ is nonstrict (see the top of tools/typecheck.luau for what it misses).
        run: lune run tools/typecheck
